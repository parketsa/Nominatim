services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nominatim
      POSTGRES_PASSWORD: nominatim_password
      POSTGRES_DB: nominatim
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  nominatim:
    build: .
    image: ghcr.io/parketsa/nominatim:latest
    environment:
      NOMINATIM_PBF_URL: https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf
      NOMINATIM_REPLICATION_URL: https://download.geofabrik.de/europe/luxembourg-updates/
      NOMINATIM_REPLICATION_INTERVAL: 86400
      NOMINATIM_RECHECK_INTERVAL: 900
      NOMINATIM_UPDATE_MODE: continuous
      NOMINATIM_THREADS: 2
      NOMINATIM_PASSWORD: nominatim_password
      NOMINATIM_IMPORT_WIKIPEDIA: "false"
      NOMINATIM_DATABASE_DSN: "pgsql:host=postgres;port=5432;user=nominatim;password=nominatim_password;dbname=nominatim"
    volumes:
      - nominatim-data:/nominatim/data
      - nominatim-cache:/var/cache/nominatim
    shm_size: "4gb"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status.php"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  postgres-data:
  nominatim-data:
  nominatim-cache:
